
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f3f7f0">
    <title>FridgeMate | Reset your password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="auth-container">
        <div class="background-glow glow-one"></div>
        <div class="background-glow glow-two"></div>

        <section class="auth-card">
            <a class="brand" href="index.html" aria-label="FridgeMate home">
                <span class="brand-icon">🥑</span>
                <span>Fridge<span class="brand-accent">Mate</span></span>
            </a>

            <div class="welcome-section">
                <h1>Forgot your password?</h1>
                <p>
                    Enter your email address and we'll send you a link to
                    choose a new one.
                </p>
            </div>

            <form id="forgot-form">
                <div class="form-field">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <button
                    id="send-button"
                    class="primary-button"
                    type="submit"
                >
                    <span id="send-text">Send reset link</span>
                    <span class="button-arrow" aria-hidden="true">→</span>
                </button>

                <p
                    id="forgot-message"
                    class="auth-message"
                    role="status"
                    aria-live="polite"
                ></p>
            </form>

            <div class="card-footer">
                <a class="auth-link" href="login.html">← Back to log in</a>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="forgot-password.js"></script>
</body>
</html>
