
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f3f7f0">
    <title>FridgeMate | Choose a new password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="auth-container">
        <div class="background-glow glow-one"></div>
        <div class="background-glow glow-two"></div>

        <section class="auth-card">
            <a class="brand" href="index.html" aria-label="FridgeMate home">
                <span class="brand-icon">🥑</span>
                <span>Fridge<span class="brand-accent">Mate</span></span>
            </a>

            <div class="welcome-section">
                <h1>Choose a new password</h1>
                <p id="reset-description">Checking your reset link...</p>
            </div>

            <form id="reset-form" hidden>
                <div class="form-field">
                    <label for="new-password">New password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="new-password"
                            name="new-password"
                            placeholder="Enter a new password"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >
                        <button
                            class="password-toggle"
                            type="button"
                            data-target="new-password"
                            aria-label="Show password"
                        >
                            Show
                        </button>
                    </div>

                    <p class="field-hint" id="password-hint"></p>
                </div>

                <div class="form-field">
                    <label for="confirm-password">Confirm new password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="confirm-password"
                            name="confirm-password"
                            placeholder="Enter it again"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >
                        <button
                            class="password-toggle"
                            type="button"
                            data-target="confirm-password"
                            aria-label="Show confirmation password"
                        >
                            Show
                        </button>
                    </div>

                    <p class="field-hint" id="confirm-hint">
                        Enter the same password again.
                    </p>
                </div>

                <button
                    id="save-button"
                    class="primary-button"
                    type="submit"
                >
                    <span id="save-text">Save new password</span>
                    <span class="button-arrow" aria-hidden="true">→</span>
                </button>
            </form>

            <p
                id="reset-message"
                class="auth-message"
                role="status"
                aria-live="polite"
            ></p>

            <div class="card-footer">
                <a class="auth-link" href="login.html">← Back to log in</a>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="reset-password.js"></script>
</body>
</html>
